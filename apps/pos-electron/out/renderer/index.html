<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      No `viewport` scaling and no zoom: 27-F11c designs in millimetres and renders in pixels,
      and a user-scalable viewport would put a second, invisible scale factor between the two.
      A counter panel is a fixed physical surface, not a responsive one.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      18 §9 — the renderer has no Node access, and this CSP is the belt to that brace: no
      remote code, no remote anything. The app ships every asset it uses; a counter runs
      offline-first (00 §5.1) and a stylesheet that needs the WAN is a screen that goes blank
      when the link does.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'"
    />
    <title>RestOS — Counter</title>
    <script type="module" crossorigin src="./assets/index-TL8LnqdI.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
