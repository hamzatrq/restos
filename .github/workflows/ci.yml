name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The ratchet order (24-F3): docs contract first, then code gates.
      - name: docs-lint (23-F8)
        run: pnpm docs:lint
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      # ⚠ `xvfb` is REQUIRED, not a convenience. Several acceptance suites spawn a REAL Electron
      # binary — `apps/pass-kds`'s `startup-refusal-returns.test.ts` CONTROL row asserts that a
      # correctly-configured pass screen actually COMES UP — and without it that row fails while
      # every refusal row beside it passes, which reads as a product defect and is not one.
      #
      # It had never run: that suite landed in `b23b9ad`, and CI failed at `lint` on both pushes
      # since, so the `test` step was never reached and the gap was invisible. Per `T-01-07` a
      # missing environment prerequisite must fail LOUDLY rather than skip, so the fix is to
      # supply the dependency, never to make the suite tolerate its absence.
      #
      # ⚠ **INSTALL IT AND DO NOT WRAP THE STEP IN IT.** The suite detects headless itself —
      # `HEADLESS = linux && !process.env.DISPLAY` — and then spawns `xvfb-run` with its own
      # `--server-args=-screen 0 1366x768x24`, because the panel size is part of what it measures.
      # Running `xvfb-run -a pnpm test` SETS `DISPLAY`, which flips that detection to false and
      # takes the suite off the path built for exactly this environment. Measured: the wrapped
      # run failed with "the configured launch never printed its boot line".
      - name: install xvfb (real-Electron acceptance suites spawn their own)
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # TEMPORARY diagnostic — remove once the Electron binary question is settled. Four CI rounds
      # have been spent on hypotheses about why `apps/pass-kds`'s real-Electron CONTROL row cannot
      # boot; this answers it with facts instead. Prints and does not fail, so it cannot mask the
      # real result.
      - name: diagnose electron availability
        run: |
          set +e
          echo "=== resolved path ==="
          node -e "console.log(require.resolve('electron'))" 2>&1
          node -e "console.log(require('electron'))" 2>&1
          echo "=== path.txt ==="
          find node_modules/.pnpm -maxdepth 4 -name path.txt -path '*electron*' -exec sh -c 'echo "{}: $(cat {})"' \;
          echo "=== dist present? ==="
          find node_modules/.pnpm -maxdepth 5 -type d -name dist -path '*electron*' -exec ls -la {} \; 2>&1 | head -20
          echo "=== pass-kds resolution ==="
          cd apps/pass-kds && node -e "console.log(require('electron'))" 2>&1
          echo "=== exit 0 regardless ==="
      - name: test
        run: pnpm test
      - name: build
        run: pnpm build

  # Spec-before-behavior (commandment 9, 20 §4.1): a PR touching behavior paths
  # must cite an FR ID in its body or carry a spec diff in the same PR.
  fr-citation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check FR citation
        run: |
          set -euo pipefail
          BASE="origin/${BASE_REF}"
          git fetch origin "${BASE_REF}" --depth=1
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(apps|services|packages)/.*\.(ts|tsx)$'; then
            if echo "$CHANGED" | grep -q '^specs/'; then
              echo "spec diff present in same PR — ok"
            elif echo "${PR_BODY:-}" | grep -qE '\b[0-9]{2}-[FN][0-9]+[a-z]?\b'; then
              echo "FR citation found in PR body — ok"
            else
              echo "::error::Behavior-path changes with no FR citation and no spec diff (commandment 9, 20 §4.1). Cite the FR IDs this PR closes in the PR body, or include the spec change."
              exit 1
            fi
          else
            echo "no behavior paths touched — ok"
          fi
